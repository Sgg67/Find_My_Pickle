name: find_my_pickle
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.2.2
  custom_button_builder: ^0.0.1
  http: ^1.5.0
  provider: ^6.1.5+1
  url_launcher: ^6.1.11
  share_plus: ^7.0.1
  geolocator: ^14.0.2
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  google_sign_in: ^6.1.5
  google_fonts: ^6.1.0
  fluttertoast: ^8.2.4
  image_picker: ^1.0.7
  firebase_storage: ^13.0.4
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/my_pickleball_image.jpeg

# Flutter Launcher Icons configuration - moved outside of flutter section
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  