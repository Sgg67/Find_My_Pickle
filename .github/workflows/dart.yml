name: Flutter CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, test]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      # Use pre-installed Flutter (fastest)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: flutter-v1
      
      # Minimal .env file
      - name: Create .env file
        run: touch .env
      
      # Skip if pubspec.lock hasn't changed
      - name: Get dependencies
        id: deps
        uses: mskelton/setup-flutter@v1
        with:
          flutter-version: 'stable'
      
      - name: Run tests
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}
          WEB_FIRE: ${{ secrets.WEB_FIRE }}
          AND_FIRE: ${{ secrets.AND_FIRE }}
          IOS_FIRE: ${{ secrets.IOS_FIRE }}
        run: |
          flutter test \
            --dart-define=MAP_KEY=$MAP_KEY \
            --dart-define=WEB_FIRE=$WEB_FIRE \
            --dart-define=AND_FIRE=$AND_FIRE \
            --dart-define=IOS_FIRE=$IOS_FIRE