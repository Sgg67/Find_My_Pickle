name: Flutter CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, test]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      # Setup Flutter with caching
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      # Create empty .env file
      - name: Create .env file
        run: touch .env
      
      # Install dependencies
      - name: Install dependencies
        run: flutter pub get
      
      # Run tests with secrets
      - name: Run tests
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}
          WEB_FIRE: ${{ secrets.WEB_FIRE }}
          AND_FIRE: ${{ secrets.AND_FIRE }}
          IOS_FIRE: ${{ secrets.IOS_FIRE }}
          MAC_FIRE: ${{ secrets.MAC_FIRE }}
          WIND_FIRE: ${{ secrets.WIND_FIRE }}
        run: |
          flutter test \
            --dart-define=MAP_KEY=$MAP_KEY \
            --dart-define=WEB_FIRE=$WEB_FIRE \
            --dart-define=AND_FIRE=$AND_FIRE \
            --dart-define=IOS_FIRE=$IOS_FIRE \
            --dart-define=MAC_FIRE=$MAC_FIRE \
            --dart-define=WIND_FIRE=$WIND_FIRE